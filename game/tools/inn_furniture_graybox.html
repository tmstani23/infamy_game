<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inn painted furnishings</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111318; color: #eee9dc; font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; padding: 10px 18px; background: #242931; }
  strong { font-size: 16px; }
  label { display: flex; align-items: center; gap: 7px; }
  #stage { position: relative; width: 100%; height: calc(100vh - 100px); min-height: 400px; }
  #view { display: block; width: 100%; height: 100%; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  #labels span { position: absolute; transform: translate(-50%, -50%); padding: 1px 4px; color: #101010; background: #fffdf1d9; border: 1px solid #222; border-radius: 2px; font: bold 12px/1.2 system-ui; }
  footer { padding: 8px 18px; color: #b9b8b1; }
  body.capture header, body.capture footer { display: none; }
  body.capture #stage { height: 100vh; }
  body.reference, body.reference #stage { background: transparent; }
</style>
</head>
<body>
<header><strong>Inn — painted furnishings</strong><label><input id="show-labels" type="checkbox"> Blueprint IDs</label>
<label><input id="walls" type="checkbox"> Walls and doorways</label>
<label><input id="fade-walls" type="checkbox" checked> Fade blocking walls</label>
<label>View room <select id="focus-room"></select></label>
<button id="doors" type="button">Open doors</button>
<label><input id="paint" type="checkbox"> Paint</label>
<label><input id="local-warp" type="checkbox"> Quadrant fit</label>
<label><input id="soft-contact" type="checkbox" checked> Contact</label>
<label><input id="exact-cutouts" type="checkbox"> Painted cutouts</label>
<label>Adjust <select id="paint-object"><option value="all">All objects</option></select></label>
<label>Paint X <input id="paint-x" type="range" min="-60" max="60" value="0"><output id="paint-x-value">0</output></label>
<label>Paint Y <input id="paint-y" type="range" min="-60" max="60" value="0"><output id="paint-y-value">0</output></label></header>
<div id="stage"><canvas id="view"></canvas><div id="labels"></div></div>
<footer>Painted cutouts follow the furnished blueprint. Select a room to fade walls in front of it; open doors to inspect the routes between rooms.</footer>
<script type="module" src="inn_furniture_graybox.js"></script>
</body>
</html>
