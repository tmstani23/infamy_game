<!doctype html><meta charset="utf-8"><base href="../game/">
<title>Chest cash preview</title>
<!-- Train robbery look test (2026-11-21): cashing a stolen chest at a town hall, the loot flying in as the workers'
     load icons and ryo coins (src/render/chest_cash_fx.js). Open through the game server: /look_tests/chest_cash_preview.html -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<style>
body{margin:0;background:#111;overflow:hidden;font:14px Georgia,serif;color:#e8dcc4}
#bar{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;align-items:center;background:rgba(14,12,10,.85);border:1px solid #6b5636;padding:8px 12px;border-radius:6px}
button{background:#2a2219;color:#e8c478;border:1px solid #6b5636;border-radius:4px;padding:5px 12px;font:inherit;cursor:pointer}
</style>
<div id="bar"><button id="replay">Cash the chest</button><button id="slow">Slow motion: off</button></div>
<script type="module">
import * as THREE from 'three';
import { CAM_QUAT, VIEW_DIR } from './src/render/iso.js';
import { createChestCashFx } from './src/render/chest_cash_fx.js';
THREE.ColorManagement.enabled = false;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
const load = (url, rx = 1, ry = 1) => { const t = new THREE.TextureLoader().load(url); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.NoColorSpace; return t; };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshBasicMaterial({ map: load('art/ground/island/grass.jpg', 12, 12), color: 0xb8b8b0 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const board = (url, w, h, x, z) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: load(url), transparent: true })); s.scale.set(w, h, 1); s.position.set(x, h / 2 - .4, z); scene.add(s); return s; };
const HALL = { x: -6, z: -9 }, HERO = { x: 6, z: 5 };
board('art/buildings/town_hall_2.png', 15, 12, HALL.x, HALL.z);
board('art/props/iron_chest.png', 1.4, 1.0, HERO.x, HERO.z);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 400); camera.quaternion.copy(CAM_QUAT);
camera.position.set(0, 0, 0).addScaledVector(VIEW_DIR, 100);
const VIEW_H = 30;
function resize() { renderer.setSize(innerWidth, innerHeight); const a = innerWidth / innerHeight; camera.left = -VIEW_H * a / 2; camera.right = VIEW_H * a / 2; camera.top = VIEW_H / 2; camera.bottom = -VIEW_H / 2; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const fx = createChestCashFx({ scene });
const go = () => fx.cash({ x: HERO.x, z: HERO.z, tx: HALL.x, tz: HALL.z, loot: { ryo: 1000, timber: 60, stone: 60 } });
document.getElementById('replay').onclick = go;
let speed = 1; document.getElementById('slow').onclick = e => { speed = speed === 1 ? .25 : 1; e.target.textContent = `Slow motion: ${speed === 1 ? 'off' : 'on'}`; };
let last = performance.now(), auto = 0;
function frame(now) { const dt = Math.min(.05, (now - last) / 1000) * speed; last = now; auto -= dt; if (auto <= 0) { go(); auto = 4; } fx.update(dt); renderer.render(scene, camera); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
