<!doctype html><meta charset="utf-8"><base href="../game/">
<title>Rail blast preview</title>
<!-- Train robbery look test (2026-11-20): the rail charge and its blast with the game's camera, ground, track strip and
     particle code (src/render/rail_blast_fx.js). Open through the game server: /look_tests/rail_blast_preview.html -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<style>
body{margin:0;background:#111;overflow:hidden;font:14px Georgia,serif;color:#e8dcc4}
#bar{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;align-items:center;background:rgba(14,12,10,.85);border:1px solid #6b5636;padding:8px 12px;border-radius:6px}
button{background:#2a2219;color:#e8c478;border:1px solid #6b5636;border-radius:4px;padding:5px 12px;font:inherit;cursor:pointer}
#t{min-width:150px}
</style>
<div id="bar"><button id="replay">Replay</button><button id="skip">Skip fuse</button><button id="slow">Slow motion: off</button><span id="t"></span></div>
<script type="module">
import * as THREE from 'three';
import { CAM_QUAT, VIEW_DIR, CAM_RIGHT, CAM_UP } from './src/render/iso.js';
import { fxShared } from './src/render/vfx.js';
import { createRailBlastFx } from './src/render/rail_blast_fx.js';
THREE.ColorManagement.enabled = false;   // painted art in its own values, like the game
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
const tex = (url, rx, ry) => { const t = new THREE.TextureLoader().load(url); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.NoColorSpace; t.anisotropy = 4; return t; };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshBasicMaterial({ map: tex('art/ground/island/grass.jpg', 10, 10), color: 0xb8b8b0 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
// the track strip along z (rails 1.4 apart, as render/rail_track.js scales it)
const TW = 362 / 153 * 1.4, TILE = TW * 1026 / 362, GAP = 5;
function strip(z0, z1) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(TW, z1 - z0), new THREE.MeshBasicMaterial({ map: tex('art/ground/rail_track.png', 1, (z1 - z0) / TILE), color: 0x9c9890, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(0, .01, (z0 + z1) / 2); m.renderOrder = 1; scene.add(m); return m;
}
let track = [strip(-60, 60)];
const setTrack = blown => { track.forEach(m => scene.remove(m)); track = blown ? [strip(-60, -GAP / 2), strip(GAP / 2, 60)] : [strip(-60, 60)]; };
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 400);
camera.quaternion.copy(CAM_QUAT);
const VIEW_H = 24;   // world units top to bottom, about the game's zoom
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  const a = innerWidth / innerHeight; camera.left = -VIEW_H * a / 2; camera.right = VIEW_H * a / 2; camera.top = VIEW_H / 2; camera.bottom = -VIEW_H / 2; camera.updateProjectionMatrix();
  fxShared.uPx.value = innerHeight * renderer.getPixelRatio() / VIEW_H;
}
addEventListener('resize', resize); resize();
const fx = createRailBlastFx({ scene });
const FUSE = 8, LOOP = 22;
let t = 0, blown = false, speed = 1;
function start(skip = false) {
  fx.clearCrater('x'); setTrack(false); blown = false;
  t = skip ? FUSE - .6 : 0;
  fx.charge('x', .7, 0, 0, FUSE); if (skip) for (let i = 0; i < 20; i++) fx.update(.01);
}
document.getElementById('replay').onclick = () => start(false);
document.getElementById('skip').onclick = () => start(true);
document.getElementById('slow').onclick = e => { speed = speed === 1 ? .25 : 1; e.target.textContent = `Slow motion: ${speed === 1 ? 'off' : 'on'}`; };
start();
let last = performance.now();
const label = document.getElementById('t');
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000) * speed; last = now;
  t += dt;
  if (!blown && t >= FUSE) { blown = true; fx.cancel('x'); fx.blast(.7, 0, 0); fx.crater('x', 0, 0, 0); setTrack(true); }
  if (t >= LOOP) start();
  fx.update(dt);
  const s = fx.shake(), target = new THREE.Vector3(0, 0, 0).addScaledVector(CAM_RIGHT, s.x).addScaledVector(CAM_UP, s.y);
  camera.position.copy(target).addScaledVector(VIEW_DIR, 100);
  label.textContent = blown ? `Blown ${(t - FUSE).toFixed(1)} s ago` : `Fuse: ${(FUSE - t).toFixed(1)} s`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
