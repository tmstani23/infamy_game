<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
</head>
<body>
<title>Lantern Street</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #05070c;
    --ink: #efe4cf;
    --ink-dim: #a99c86;
    --ink-faint: #6f6657;
    --ember: #ffb15c;
    --ember-deep: #d2572b;
    --glass: rgba(10, 12, 18, 0.62);
    --glass-edge: rgba(255, 196, 128, 0.16);
    --glass-hover: rgba(255, 177, 92, 0.12);
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #stage canvas:active { cursor: grabbing; }

  .card {
    position: fixed; top: 16px; left: 16px; max-width: min(360px, calc(100vw - 32px));
    padding: 14px 18px 13px; border-radius: 14px;
    background: var(--glass); border: 1px solid var(--glass-edge);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    pointer-events: none;
  }
  .eyebrow { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ember); margin: 0 0 6px; }
  h1 { font-family: var(--serif); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0 0 6px; letter-spacing: 0.02em; }
  .sub { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-dim); }

  .controls {
    position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    pointer-events: none;
  }
  .group {
    display: flex; gap: 4px; padding: 4px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--glass-edge);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    pointer-events: auto;
  }
  button {
    font: 500 13px/1 var(--sans); color: var(--ink-dim); background: transparent;
    border: 0; border-radius: 9px; padding: 10px 13px; cursor: pointer; min-height: 38px;
    transition: background 0.2s, color 0.2s;
  }
  button:hover { background: var(--glass-hover); color: var(--ink); }
  button[aria-pressed="true"] { color: #1a0f06; background: linear-gradient(180deg, #ffc27a, #f0954a); }
  .slider label { display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 38px; font-size: 12.5px; color: var(--ink-dim); }
  .slider input { width: 140px; accent-color: var(--ember); }
  button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  #err {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
    background: var(--bg);
  }
  #err[hidden] { display: none; }
  #err p { max-width: 420px; color: var(--ink-dim); font-size: 15px; line-height: 1.5; }

  @media (max-width: 560px) {
    .card { padding: 11px 14px; }
    h1 { font-size: 21px; }
    .sub { font-size: 12px; }
    button { padding: 9px 10px; font-size: 12.5px; }
    .slider input { width: 110px; }
  }
</style>

<div id="stage" aria-label="A rainy, lantern-lit street at night, rendered in 3D. Drag to rotate, scroll or pinch to zoom."></div>

<header class="card">
  <p class="eyebrow">Look test · three.js</p>
  <h1>Lantern Street</h1>
  <p class="sub">Drag to rotate. Scroll or pinch to zoom. Right-drag or two fingers to pan.</p>
</header>

<nav class="controls" aria-label="Scene controls">
  <div class="group" role="group" aria-label="Camera">

    <button id="vStreet" aria-pressed="false">Street level</button>
  </div>
  <div class="group" role="group" aria-label="Effects">
    <button id="tRain" aria-pressed="true">Rain</button>
    <button id="tMist" aria-pressed="true">Mist</button>
    <button id="tCut" aria-pressed="true">See-through</button>
    <button id="tOrbit" aria-pressed="true">Slow orbit</button>

  <div class="group slider" role="group" aria-label="Style">
    <label for="style"><span>Realistic</span><input id="style" type="range" min="0" max="100" value="65"><span>Anime</span></label>
  </div>
</nav>

<div id="err" hidden><p>Loading…</p></div>
<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#05070c;color:#a99c86;padding:16px;text-align:center">This scene needs JavaScript and WebGL.</div></noscript>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(function () {
'use strict';

const errBox = document.getElementById('err');
function fail(msg) { errBox.hidden = false; errBox.querySelector('p').textContent = msg; }
if (!window.THREE || !THREE.OrbitControls || !THREE.EffectComposer || !THREE.Reflector || !THREE.BufferGeometryUtils) {
  fail('The 3D library did not load. Check your connection and reload the page.');
  return;
}

let reduceMotion = false;
try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
const coarse = (() => { try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
const small = Math.min(innerWidth, innerHeight) < 620 || coarse;

/* ---------------- renderer ---------------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  fail('This browser could not start WebGL, which the scene needs.');
  return;
}
const PR = Math.min(window.devicePixelRatio || 1, small ? 1.5 : 1.75);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.LinearEncoding;   // grading pass does tone map + gamma
renderer.toneMapping = THREE.NoToneMapping;
document.getElementById('stage').appendChild(renderer.domElement);

const gl = renderer.getContext();
const isGL2 = renderer.capabilities.isWebGL2;
const floatRT = isGL2 && !!gl.getExtension('EXT_color_buffer_float');
const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ---------------- helpers ---------------- */
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(20261012);
const rr = (a, b) => a + (b - a) * R();
const lin = (r, g, b) => new THREE.Color(r, g, b);

function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function toTex(c, srgb, repeat) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.encoding = THREE.sRGBEncoding;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, maxAniso);
  return t;
}

/* ---------------- procedural textures ---------------- */
function woodTexture() {
  const [c, x] = canvas(256, 256);
  x.fillStyle = '#6a5442'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 8; i++) {
    const v = Math.floor(rr(-14, 14));
    x.fillStyle = `rgb(${106 + v},${84 + v},${66 + v})`;
    x.fillRect(i * 32, 0, 32, 256);
    x.fillStyle = 'rgba(20,12,8,0.75)'; x.fillRect(i * 32, 0, 2, 256);
    for (let g = 0; g < 9; g++) {
      x.strokeStyle = `rgba(30,18,10,${rr(0.08, 0.25)})`; x.lineWidth = rr(0.5, 1.5);
      const gx = i * 32 + rr(4, 30);
      x.beginPath(); x.moveTo(gx, 0);
      for (let y = 0; y <= 256; y += 32) x.lineTo(gx + Math.sin(y * 0.04 + g) * 1.5, y);
      x.stroke();
    }
  }
  // rain staining from the top
  const gr = x.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, 'rgba(10,8,6,0.35)'); gr.addColorStop(0.4, 'rgba(10,8,6,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
  return toTex(c, true, true);
}
function plasterTexture() {
  const [c, x] = canvas(256, 256);
  x.fillStyle = '#8b8478'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    x.fillStyle = `rgba(${R() < 0.5 ? '40,36,30' : '170,162,150'},${rr(0.03, 0.09)})`;
    const s = rr(2, 14); x.fillRect(rr(0, 256), rr(0, 256), s, s);
  }
  for (let i = 0; i < 28; i++) {
    const sx = rr(0, 256), len = rr(40, 220);
    const g = x.createLinearGradient(0, 0, 0, len);
    g.addColorStop(0, 'rgba(30,28,26,0.32)'); g.addColorStop(1, 'rgba(30,28,26,0)');
    x.fillStyle = g; x.fillRect(sx, 0, rr(2, 8), len);
  }
  return toTex(c, true, true);
}
function tileTexture() {
  const [c, x] = canvas(256, 256);
  x.fillStyle = '#4f5763'; x.fillRect(0, 0, 256, 256);
  for (let col = 0; col < 8; col++) {
    const g = x.createLinearGradient(col * 32, 0, col * 32 + 32, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.3, 'rgba(255,255,255,0.10)');
    g.addColorStop(0.55, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
    x.fillStyle = g; x.fillRect(col * 32, 0, 32, 256);
  }
  for (let row = 0; row < 8; row++) {
    x.fillStyle = 'rgba(0,0,0,0.55)'; x.fillRect(0, row * 32, 256, 3);
    x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(0, row * 32 + 3, 256, 2);
  }
  return toTex(c, true, true);
}
function shojiTexture() {
  const [c, x] = canvas(256, 256);
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#e9cf9c'); g.addColorStop(1, '#fff0cf');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 400; i++) { x.fillStyle = `rgba(150,110,60,${rr(0.02, 0.06)})`; x.fillRect(rr(0, 256), rr(0, 256), rr(1, 6), rr(1, 6)); }
  x.fillStyle = '#3a2717';
  for (let i = 0; i <= 4; i++) x.fillRect(i * 64 - 3, 0, 6, 256);
  for (let j = 0; j <= 5; j++) x.fillRect(0, j * 51 - 2, 256, 4);
  return toTex(c, true, true);
}
function lanternTexture(crest) {
  const [c, x] = canvas(256, 256);
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#c9a98a'); g.addColorStop(0.5, '#fff6ea'); g.addColorStop(1, '#c9a98a');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  for (let y = 6; y < 256; y += 13) { x.fillStyle = 'rgba(90,40,15,0.38)'; x.fillRect(0, y, 256, 2); }
  if (crest) {
    [64, 192].forEach(cx => {
      x.strokeStyle = 'rgba(25,8,4,0.9)'; x.lineWidth = 9;
      x.beginPath(); x.arc(cx, 128, 34, 0, Math.PI * 2); x.stroke();
      x.fillStyle = 'rgba(25,8,4,0.9)';
      x.beginPath(); x.arc(cx, 128, 13, 0, Math.PI * 2); x.fill();
    });
  }
  return toTex(c, true, false);
}
function pavingTextures() {
  const S = 512;
  const [c, x] = canvas(S, S); const [cr, xr] = canvas(S, S);
  x.fillStyle = '#0c0d10'; x.fillRect(0, 0, S, S);
  xr.fillStyle = '#e6e6e6'; xr.fillRect(0, 0, S, S);
  const rowH = 64;
  for (let r = 0; r < S / rowH; r++) {
    let cuts = [], p = rr(0, 60);
    while (p < S + p * 0) { cuts.push(p); p += rr(70, 150); if (p > S + cuts[0] - 60) break; }
    for (let i = 0; i < cuts.length; i++) {
      const a = cuts[i], b = (i + 1 < cuts.length) ? cuts[i + 1] : cuts[0] + S;
      const v = Math.floor(rr(-10, 12));
      const col = `rgb(${46 + v},${49 + v},${55 + v})`;
      const rough = Math.floor(rr(70, 115));
      for (const off of [0, -S]) {
        x.fillStyle = col; x.fillRect(a + off + 2, r * rowH + 2, b - a - 4, rowH - 4);
        xr.fillStyle = `rgb(${rough},${rough},${rough})`; xr.fillRect(a + off + 2, r * rowH + 2, b - a - 4, rowH - 4);
      }
    }
  }
  for (let i = 0; i < 5000; i++) {
    const px = rr(0, S), py = rr(0, S), s = rr(1, 3);
    x.fillStyle = `rgba(${R() < 0.5 ? '0,0,0' : '120,125,135'},${rr(0.05, 0.18)})`; x.fillRect(px, py, s, s);
    xr.fillStyle = `rgba(${R() < 0.5 ? '255,255,255' : '0,0,0'},${rr(0.05, 0.15)})`; xr.fillRect(px, py, s, s);
  }
  const map = toTex(c, true, true), rough = toTex(cr, false, true);
  return { map, rough };
}
// puddle mask over the street band, sampled in world space by the ground shader
const MASK = { x0: -34, x1: 36, z0: -4, z1: 4 };
function puddleTexture() {
  const W = 2048, H = 256;
  const [c, x] = canvas(W, H);
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  const sx = W / (MASK.x1 - MASK.x0), sz = H / (MASK.z1 - MASK.z0);
  const blob = (wx, wz, rx, rz, a) => {
    x.save(); x.translate((wx - MASK.x0) * sx, (wz - MASK.z0) * sz); x.scale(rx * sx, rz * sz);
    const g = x.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(0.55, `rgba(255,255,255,${a * 0.75})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(0, 0, 1, 0, Math.PI * 2); x.fill(); x.restore();
  };
  for (let i = 0; i < 46; i++) {
    const wx = rr(MASK.x0 + 2, MASK.x1 - 2), wz = rr(-2.6, 2.6);
    const n = 3 + Math.floor(R() * 4);
    for (let k = 0; k < n; k++) blob(wx + rr(-1.1, 1.1), wz + rr(-0.5, 0.5), rr(0.5, 1.5), rr(0.3, 0.8), rr(0.6, 1));
  }
  // long gutters along both building lines
  for (let side = -1; side <= 1; side += 2) {
    for (let wx = MASK.x0; wx < MASK.x1; wx += 0.8) blob(wx, side * rr(3.0, 3.25), rr(0.6, 1.4), rr(0.18, 0.32), rr(0.5, 0.95));
  }
  const t = toTex(c, false, false);
  t.anisotropy = 1;
  return t;
}
function glowTexture() {
  const [c, x] = canvas(128, 128);
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.12, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.14)'); g.addColorStop(0.7, 'rgba(255,255,255,0.03)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return toTex(c, false, false);
}
function streakTexture() {
  const [c, x] = canvas(64, 256);
  const img = x.createImageData(64, 256);
  for (let j = 0; j < 256; j++) for (let i = 0; i < 64; i++) {
    const u = (i - 31.5) / 32, v = (j - 127.5) / 128;
    const a = Math.exp(-u * u * 7) * Math.exp(-v * v * 3.2) * (0.85 + 0.15 * Math.sin(j * 0.7 + i * 0.13));
    const k = (j * 64 + i) * 4; img.data[k] = img.data[k + 1] = img.data[k + 2] = 255; img.data[k + 3] = Math.max(0, Math.min(255, a * 255));
  }
  x.putImageData(img, 0, 0);
  return toTex(c, false, false);
}
function spillTexture(striped) {
  const [c, x] = canvas(64, 128);
  const img = x.createImageData(64, 128);
  for (let j = 0; j < 128; j++) for (let i = 0; i < 64; i++) {
    const v = j / 127;                                  // 0 at facade (canvas top), 1 far
    let a = Math.pow(1 - v, 2.2);
    const edge = Math.min(1, Math.min(i, 63 - i) / 10);
    if (!striped) a *= edge;
    if (striped) { const s = (i / 64); a *= 0.25 + 0.75 * (0.5 + 0.5 * Math.cos(s * Math.PI * 2)); }
    const k = (j * 64 + i) * 4; img.data[k] = img.data[k + 1] = img.data[k + 2] = 255; img.data[k + 3] = a * 255;
  }
  x.putImageData(img, 0, 0);
  const t = toTex(c, false, false);
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}
function mistTexture() {
  const S = 256; const [c, x] = canvas(S, S); const img = x.createImageData(S, S);
  const grids = [4, 8, 16, 32].map(p => { const a = new Float32Array(p * p); for (let i = 0; i < a.length; i++) a[i] = R(); return { p, a }; });
  const sm = t => t * t * (3 - 2 * t);
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    let v = 0, amp = 0.55, tot = 0;
    for (const { p, a } of grids) {
      const fx = i / S * p, fy = j / S * p, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = sm(fx - x0), ty = sm(fy - y0);
      const g = (xx, yy) => a[((yy % p) + p) % p * p + ((xx % p) + p) % p];
      const n = (g(x0, y0) * (1 - tx) + g(x0 + 1, y0) * tx) * (1 - ty) + (g(x0, y0 + 1) * (1 - tx) + g(x0 + 1, y0 + 1) * tx) * ty;
      v += n * amp; tot += amp; amp *= 0.5;
    }
    v = Math.max(0, Math.min(1, (v / tot - 0.35) * 2.2));
    const k = (j * S + i) * 4; img.data[k] = img.data[k + 1] = img.data[k + 2] = v * 255; img.data[k + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return toTex(c, false, true);
}

const T = {
  wood: woodTexture(), plaster: plasterTexture(), tile: tileTexture(), shoji: shojiTexture(),
  lanRed: lanternTexture(true), lanAmb: lanternTexture(false),
  puddle: puddleTexture(), glow: glowTexture(), streak: streakTexture(),
  spillS: spillTexture(true), spillP: spillTexture(false), mist: mistTexture(),
};
const PAV = pavingTextures();

/* ---------------- scene, camera, sky ---------------- */
const FOG = lin(0.009, 0.013, 0.022);
const FOG_D = 0.021;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG, FOG_D);
renderer.setClearColor(FOG, 1);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.8, 420);

const MOON_DIR = new THREE.Vector3(-0.55, 0.42, -0.72).normalize();
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uMoon: { value: MOON_DIR } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position = p.xyww; }`,
    fragmentShader: `
      uniform vec3 uMoon; varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        vec3 hor = vec3(0.020, 0.028, 0.046), zen = vec3(0.0025, 0.0035, 0.008);
        vec3 c = mix(hor, zen, smoothstep(-0.02, 0.55, d.y));
        c = mix(c, vec3(0.009,0.013,0.022), smoothstep(0.0, -0.2, d.y));
        float m = max(dot(d, uMoon), 0.0);
        c += vec3(0.05,0.065,0.095) * pow(m, 8.0) + vec3(0.25,0.30,0.40) * pow(m, 180.0);
        c += vec3(1.6,1.75,2.0) * smoothstep(0.99955, 0.99975, m);
        gl_FragColor = vec4(c, 1.0);
      }`,
  })
);
sky.renderOrder = -10;
scene.add(sky);

scene.add(new THREE.HemisphereLight(lin(0.22, 0.29, 0.46), lin(0.05, 0.035, 0.025), 0.42));
const moon = new THREE.DirectionalLight(lin(0.5, 0.6, 0.85), 0.42);

/* ---------------- style + see-through patches for building materials ----------------
   Lighting stays physically based; on top of it:
   - soft cel bands on direct light, with a hand-drawn wobble at the band edges
   - shadows pushed toward blue instead of black
   - a dithered cutaway that dissolves anything between the camera and the street */
const STYLE = { uStyle: { value: 0.65 }, uBands: { value: 1.5 } };
const CUT = { uCutOn: { value: 0 }, uCutR: { value: 0.5 }, uCutDepth: { value: 30 }, uAspect: { value: 1 } };
const CUT_GLSL = `
  uniform float uCutOn, uCutR, uCutDepth, uAspect;
  float cutAmount(vec4 clip, float viewZ, float worldY) {
    vec2 q = clip.xy / clip.w; q.x *= uAspect;
    return uCutOn * step(0.08, worldY) * smoothstep(uCutR, uCutR * 0.7, length(q)) * smoothstep(uCutDepth, uCutDepth - 3.0, viewZ);
  }
  float dither(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }`;
function stylize(mat) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, CUT, STYLE);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec4 vCutClip; varying float vCutZ; varying vec3 vStyW;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvCutClip = gl_Position; vCutZ = -mvPosition.z; vStyW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec4 vCutClip; varying float vCutZ; varying vec3 vStyW;\nuniform float uStyle, uBands;\n' + CUT_GLSL)
      .replace('void main() {', 'void main() {\n  { float ck = cutAmount(vCutClip, vCutZ, vStyW.y); if (ck > 0.001 && ck > dither(gl_FragCoord.xy)) discard; }')
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          float alb = max(dot(diffuseColor.rgb, vec3(0.2126, 0.7152, 0.0722)), 1e-3);
          float dl = dot(reflectedLight.directDiffuse, vec3(0.2126, 0.7152, 0.0722)) / alb;
          float wob = sin(vStyW.x * 3.1 + vStyW.y * 4.7) * sin(vStyW.z * 2.3 - vStyW.y * 3.3);
          float f = log2(dl + 1e-3) * uBands + wob * 0.22;
          float q = floor(f) + smoothstep(0.38, 0.62, fract(f));
          float dq = exp2(q / uBands);
          reflectedLight.directDiffuse *= mix(1.0, dq / max(dl, 1e-3), uStyle);
          reflectedLight.indirectDiffuse *= mix(vec3(1.0), vec3(0.62, 0.82, 1.55), uStyle);
        }`);
  };
}
['wood', 'plaster', 'beam', 'slat', 'tile', 'ridge', 'stone', 'shojiA', 'shojiB', 'shojiC', 'doorGlow', 'dark',
 'norenI', 'norenR', 'norenB', 'lanRed', 'lanAmb', 'cap', 'andon', 'bucket'].forEach(k => stylize(mats[k]));
mats.tile.side = THREE.DoubleSide;

/* ---------------- static geometry builder (merged by material) ---------------- */
const parts = {};
const tmp = new THREE.Object3D();
const M4 = new THREE.Matrix4();
function put(key, geo, B, x, y, z, rx, ry, rz) {
  tmp.position.set(x, y, z); tmp.rotation.set(rx || 0, ry || 0, rz || 0); tmp.scale.set(1, 1, 1); tmp.updateMatrix();
  M4.multiplyMatrices(B, tmp.matrix);
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  g.applyMatrix4(M4);
  (parts[key] || (parts[key] = [])).push(g);
}
function box(w, h, d, ts) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (ts) {
    const uv = g.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
    for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const k = f * 4 + i; uv.setXY(k, uv.getX(k) * dims[f][0] / ts, uv.getY(k) * dims[f][1] / ts); }
  }
  return g;
}
function plane(w, h, tu, tv) {
  const g = new THREE.PlaneGeometry(w, h);
  if (tu || tv) { const uv = g.attributes.uv; for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) * (tu || 1), uv.getY(k) * (tv || 1)); }
  return g;
}
function gable(w, hs, r) {
  const s = new THREE.Shape(); s.moveTo(-hs, 0); s.lineTo(0, r); s.lineTo(hs, 0); s.lineTo(-hs, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: w, bevelEnabled: false });
  g.rotateY(-Math.PI / 2); g.translate(w / 2, 0, 0);
  const uv = g.attributes.uv; for (let k = 0; k < uv.count; k++) uv.setXY(k, uv.getX(k) / 1.6, uv.getY(k) / 1.6);
  return g;
}
const sphere = new THREE.SphereGeometry(1, 22, 16);

// curved gable roof: concave slopes, eave corners that sweep up (sori)
function curvedRoof(w, zf, zb, rise, lift) {
  const hs = (zf - zb) / 2, zm = (zf + zb) / 2;
  const g = new THREE.PlaneGeometry(w, zf - zb, 10, 16);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), t = Math.min(1, Math.abs(z) / hs), ax = Math.min(1, Math.abs(x) / (w / 2));
    p.setXYZ(i, x, rise * Math.pow(1 - t, 1.32) + lift * Math.pow(ax, 3) * t * t, z + zm);
    uv.setXY(i, uv.getX(i) * w, uv.getY(i) * (zf - zb));
  }
  g.computeVertexNormals();
  return g;
}
// shed roof over the shopfront, flattening out at the eave
function curvedShed(w, len, drop, lift) {
  const g = new THREE.PlaneGeometry(w, len, 8, 6);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), s = Math.min(1, Math.max(0, (p.getZ(i) + len / 2) / len)), ax = Math.min(1, Math.abs(x) / (w / 2));
    p.setXYZ(i, x, -drop * s + drop * 0.42 * s * s + lift * Math.pow(ax, 3) * s * s, s * len);
    uv.setXY(i, uv.getX(i) * w, uv.getY(i) * len);
  }
  g.computeVertexNormals();
  return g;
}
// hip roof for the pagoda tiers, corners lifting
function hipRoof(size, rise, lift) {
  const h = size / 2;
  const g = new THREE.PlaneGeometry(size, size, 18, 18);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), m = Math.min(1, Math.max(Math.abs(x), Math.abs(z)) / h);
    p.setY(i, rise * Math.pow(1 - m, 1.6) + lift * Math.pow((Math.abs(x) / h) * (Math.abs(z) / h), 2.4));
    uv.setXY(i, uv.getX(i) * size, uv.getY(i) * size);
  }
  g.computeVertexNormals();
  return g;
}
function ridgeCap(w) { const g = new THREE.CylinderGeometry(0.13, 0.13, w, 10); g.rotateZ(Math.PI / 2); return g; }
function roofOn(B, w, zf, zb, base, pitch, lift) {
  const hs = (zf - zb) / 2, zm = (zf + zb) / 2, rise = hs * pitch;
  put('tile', curvedRoof(w + 0.5, zf, zb, rise, lift), B, 0, base, 0);
  put('ridge', ridgeCap(w + 0.2), B, 0, base + rise + 0.04, zm);
  for (const sx of [-1, 1]) put('ridge', box(0.2, 0.42, 0.36), B, sx * (w / 2 + 0.12), base + rise + 0.14, zm);
  put('plaster', gable(w - 0.06, hs - 0.95, rise - 0.3), B, 0, base - 0.01, zm);
}

const lanterns = [];   // {pos, kind:'red'|'amb', size, light:boolean}
const glows = [];      // {pos, color, size}
const lightSlots = []; // {pos, color} for rain/ripple shading

function sideMatrix(x, side, zFace) {
  // local frame: facade at z=0, street toward +z, building extends to -z
  const m = new THREE.Matrix4();
  if (side < 0) m.makeTranslation(x, 0, -zFace);
  else { m.makeRotationY(Math.PI); m.setPosition(x, 0, zFace); }
  return m;
}
function localToWorld(B, x, y, z) { return new THREE.Vector3(x, y, z).applyMatrix4(B); }

function hangLantern(B, x, y, z, kind, size, cordTop) {
  const p = localToWorld(B, x, y, z);
  lanterns.push({ pos: p, kind, size });
  const r = size === 'big' ? 0.3 : size === 'mid' ? 0.22 : 0.15;
  const h = r * 1.45;
  const I = new THREE.Matrix4();
  const body = sphere.clone(); body.scale(r, h, r);
  put(kind === 'red' ? 'lanRed' : 'lanAmb', body, I, p.x, p.y, p.z);
  const cap = new THREE.CylinderGeometry(r * 0.62, r * 0.62, 0.06, 12);
  put('cap', cap, I, p.x, p.y + h * 0.96, p.z);
  put('cap', cap, I, p.x, p.y - h * 0.96, p.z);
  if (cordTop !== undefined && cordTop > p.y + h) put('cap', box(0.015, cordTop - p.y - h, 0.015), I, p.x, (cordTop + p.y + h) / 2, p.z);
  const col = kind === 'red' ? lin(1.0, 0.22, 0.08) : lin(1.0, 0.55, 0.2);
  glows.push({ pos: p, color: col, size: r * 9 });
  return p;
}

const spillGeo = { S: [], P: [] };
function spill(B, x, w, len, striped, slatPitch) {
  const g = plane(w, len, striped ? w / slatPitch : 1, 1);
  tmp.position.set(x, 0.035, len / 2); tmp.rotation.set(-Math.PI / 2, 0, 0); tmp.scale.set(1, 1, 1); tmp.updateMatrix();
  M4.multiplyMatrices(B, tmp.matrix);
  const gg = g.toNonIndexed(); gg.applyMatrix4(M4);
  (striped ? spillGeo.S : spillGeo.P).push(gg);
}

/* ---------------- a machiya-style townhouse ---------------- */
function townhouse(B, w, d, opt) {
  const twoStorey = opt.two, h1 = 2.7, h2 = 1.75;
  const front = twoStorey ? -0.35 : 0;
  const wallTop = twoStorey ? h1 + h2 : h1 + 0.75;
  // bodies
  put('wood', box(w, h1, d, 1.6), B, 0, h1 / 2, -d / 2);
  if (twoStorey) put('plaster', box(w, h2, d + front, 1.6), B, 0, h1 + h2 / 2, front - (d + front) / 2);
  else put('wood', box(w, 0.75, d, 1.6), B, 0, h1 + 0.375, -d / 2);
  // posts + beams
  put('beam', box(0.17, h1, 0.17), B, -w / 2 + 0.085, h1 / 2, 0.06);
  put('beam', box(0.17, h1, 0.17), B, w / 2 - 0.085, h1 / 2, 0.06);
  put('beam', box(w, 0.2, 0.2), B, 0, h1 - 0.1, 0.07);
  put('beam', box(w, 0.12, 0.16), B, 0, 0.06, 0.06);
  // ground-floor openings
  const doorW = 1.0, doorLeft = opt.doorLeft;
  const doorX = doorLeft ? -w / 2 + 0.25 + doorW / 2 : w / 2 - 0.25 - doorW / 2;
  const panelW = w - doorW - 0.75;
  const panelX = doorLeft ? doorX + doorW / 2 + 0.2 + panelW / 2 : doorX - doorW / 2 - 0.2 - panelW / 2;
  const lit = opt.lit;
  if (panelW > 0.6) {
    const pm = lit === 2 ? 'shojiA' : lit === 1 ? 'shojiB' : 'dark';
    put(pm, plane(panelW, 1.85, panelW / 1.2, 1.85 / 1.2), B, panelX, 1.15, 0.02);
    const pitch = 0.115, n = Math.floor(panelW / pitch);
    for (let i = 0; i <= n; i++) put('slat', box(0.045, 1.95, 0.05), B, panelX - panelW / 2 + i * (panelW / n), 1.15, 0.12);
    put('beam', box(panelW + 0.12, 0.09, 0.1), B, panelX, 2.14, 0.12);
    put('beam', box(panelW + 0.12, 0.09, 0.1), B, panelX, 0.17, 0.12);
    if (lit) spill(B, panelX, panelW * 1.05, lit === 2 ? 2.8 : 1.8, true, panelW / n);
  }
  // door + noren
  const open = opt.open;
  put(open ? 'doorGlow' : 'dark', plane(doorW, 2.1), B, doorX, 1.05, 0.015);
  put('beam', box(0.09, 2.2, 0.12), B, doorX - doorW / 2 - 0.04, 1.1, 0.06);
  put('beam', box(0.09, 2.2, 0.12), B, doorX + doorW / 2 + 0.04, 1.1, 0.06);
  if (open) {
    const nk = opt.noren;
    for (let i = 0; i < 3; i++) put(nk, plane(0.31, 0.72), B, doorX - 0.33 + i * 0.33, 1.72, 0.2, 0.06);
    spill(B, doorX, doorW * 1.5, 3.4, false);
  }
  // pent roof (hisashi)
  put('tile', curvedShed(w + 0.16, 1.1, 0.5, 0.16), B, 0, h1 + 0.36, 0);
  put('ridge', box(w + 0.16, 0.08, 0.08), B, 0, h1 + 0.36 - 0.5 + 0.21 + 0.06, 1.1);
  // upper floor window
  if (twoStorey) {
    const uw = Math.min(w * 0.55, 2.4);
    const um = opt.upLit ? (R() < 0.5 ? 'shojiB' : 'shojiC') : 'dark';
    put(um, plane(uw, 0.6, uw / 1.2, 0.5), B, rr(-0.3, 0.3), h1 + h2 * 0.55, front + 0.015);
    const n = Math.floor(uw / 0.16);
    for (let i = 0; i <= n; i++) put('slat', box(0.06, 0.66, 0.06), B, -uw / 2 + i * (uw / n) + (0), h1 + h2 * 0.55, front + 0.05);
    put('beam', box(w, 0.14, 0.14), B, 0, h1 + h2 - 0.07, front + 0.05);
  }
  // main roof, ridge parallel to the street
  roofOn(B, w, front + 0.8, -d - 0.5, wallTop, opt.pitch, 0.32);
  // lantern by the door
  if (opt.lantern) {
    const lx = doorX + (doorLeft ? 1 : -1) * (doorW / 2 + 0.38);
    const big = opt.lantern === 'red';
    hangLantern(B, Math.max(-w / 2 + 0.35, Math.min(w / 2 - 0.35, lx)), h1 - (big ? 0.62 : 0.48), 0.78, opt.lantern, big ? 'big' : 'mid', h1 + 0.02);
  }
  // floor lantern (andon)
  if (opt.andon) {
    const ax = doorX + (doorLeft ? 1 : -1) * (doorW / 2 + 0.55);
    put('andon', box(0.32, 0.55, 0.32), B, ax, 0.62, 0.55);
    put('beam', box(0.38, 0.05, 0.38), B, ax, 0.92, 0.55);
    for (const [dx, dz] of [[-0.14, -0.14], [0.14, -0.14], [-0.14, 0.14], [0.14, 0.14]]) put('beam', box(0.035, 0.36, 0.035), B, ax + dx, 0.18, 0.55 + dz);
    const p = localToWorld(B, ax, 0.62, 0.55);
    glows.push({ pos: p, color: lin(1.0, 0.6, 0.25), size: 2.0 });
  }
  // props
  if (opt.barrels) {
    const bx = panelX + (R() < 0.5 ? -1 : 1) * Math.min(panelW / 2 - 0.3, 0.6);
    const cyl = new THREE.CylinderGeometry(0.26, 0.24, 0.62, 14);
    put('beam', cyl, B, bx, 0.31, 0.62);
    if (R() < 0.6) put('beam', cyl, B, bx + 0.52, 0.31, 0.6);
  }
  if (opt.buckets) {
    const bk = new THREE.CylinderGeometry(0.11, 0.09, 0.2, 10);
    const bx = doorX + (doorLeft ? 1 : -1) * 0.9;
    for (let i = 0; i < 3; i++) put('bucket', bk, B, bx - 0.12 + i * 0.12, 0.1, 0.42);
    put('bucket', bk, B, bx - 0.06, 0.3, 0.42); put('bucket', bk, B, bx + 0.06, 0.3, 0.42);
    put('bucket', bk, B, bx, 0.5, 0.42);
  }
}

function backHouse(B, w, d, h, pitch) {
  put(R() < 0.5 ? 'plaster' : 'wood', box(w, h, d, 1.6), B, 0, h / 2, -d / 2);
  if (R() < 0.45) put(R() < 0.6 ? 'shojiC' : 'shojiB', plane(rr(0.6, 1.2), 0.5), B, rr(-w / 4, w / 4), h - rr(0.7, 1.3), 0.02);
  roofOn(B, w, 0.7, -d - 0.5, h, pitch, 0.3);
}

/* ---------------- lay out the street ---------------- */
const STREET_HALF = 3.5;
const X0 = -31, X1 = 33;
const NOREN = ['norenI', 'norenI', 'norenR', 'norenB'];
let houseIndex = 0;
for (const side of [-1, 1]) {
  let x = X0 + (side > 0 ? 1.3 : 0);
  while (x < X1) {
    const w = rr(3.3, 4.8), d = rr(5.0, 6.5);
    const cx = x + w / 2;
    const B = sideMatrix(cx, side, STREET_HALF);
    const near = Math.abs(cx) < 24;
    const lantern = R() < 0.82 ? (R() < 0.45 ? 'red' : 'amb') : null;
    townhouse(B, w, d, {
      two: R() < 0.72, doorLeft: R() < 0.5,
      lit: R() < 0.18 ? 0 : (R() < 0.55 ? 2 : 1), open: R() < 0.7, upLit: R() < 0.7,
      noren: NOREN[Math.floor(R() * NOREN.length)], pitch: rr(0.42, 0.58),
      lantern, andon: R() < 0.32, barrels: R() < 0.35, buckets: R() < 0.15,
    });
    if (lantern && near && (houseIndex % 2 === 0)) lanterns[lanterns.length - 1].light = true;
    houseIndex++;
    // the row behind
    const bw = rr(3.5, 6), bB = sideMatrix(x + bw / 2, side, STREET_HALF + rr(7.5, 9.5));
    backHouse(bB, bw, rr(4.5, 6.5), rr(3.4, 5.6), rr(0.45, 0.6));
    x += w + (R() < 0.12 ? rr(0.9, 1.4) : rr(0.05, 0.25));
  }
}
// a third, taller row far back for skyline depth
for (const side of [-1, 1]) for (let x = X0 - 6; x < X1 + 6; x += rr(4.5, 7)) {
  backHouse(sideMatrix(x, side, STREET_HALF + rr(17, 22)), rr(4, 6.5), rr(5, 7), rr(4.5, 8), rr(0.45, 0.6));
}

/* strings of lanterns across the street */
const wires = [];
for (const sx of [-7.5, 6.5, 19]) {
  const pts = [], n = 7, top = 4.55, sag = 0.65;
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, z = -STREET_HALF + t * STREET_HALF * 2;
    pts.push(new THREE.Vector3(sx, top - sag * 4 * t * (1 - t), z));
  }
  wires.push(pts);
  const I = new THREE.Matrix4();
  for (let i = 1; i <= n; i++) {
    const t = i / (n + 1), z = -STREET_HALF + t * STREET_HALF * 2;
    const y = top - sag * 4 * t * (1 - t);
    hangLantern(I, sx, y - 0.32, z, i % 2 ? 'red' : 'amb', 'small', y);
    if (i === 4) lanterns[lanterns.length - 1].light = true;
  }
}

/* a five-storey pagoda closing the west end, and stone lanterns in its plaza */
(function pagoda() {
  const I = new THREE.Matrix4(), px = -41;
  put('stone', box(6.5, 0.7, 6.5, 2), I, px, 0.35, 0);
  let y = 0.7;
  for (let i = 0; i < 5; i++) {
    const bw = 3.6 - i * 0.42;
    put('beam', box(bw, 1.25, bw, 1.6), I, px, y + 0.62, 0);
    put('tile', hipRoof(bw + 2.5, 0.75, 0.55), I, px, y + 1.22, 0);
    if (i === 0) {
      const e = (bw + 2.1) / 2;
      for (const [dx, dz] of [[-e, -e], [e, -e], [-e, e], [e, e]]) hangLantern(I, px + dx, y + 0.95, dz, 'amb', 'small', y + 1.3);
    }

      float ca = dot(q, q) * 0.0035;
      vec3 c;
      c.r = texture2D(tDiffuse, vUv + q * ca).r;
      c.g = texture2D(tDiffuse, vUv).g;
      c.b = texture2D(tDiffuse, vUv - q * ca).b;

      // ink outlines (normals + depth), drawn in a deep indigo rather than black
      vec2 px = uThick / uRes;
      float e = edgeAt(vUv, px);
      if (uDebug > 0.5) { gl_FragColor = vec4(vec3(e), 1.0); if (uDebug > 1.5) gl_FragColor = texture2D(tND, vUv); return; }
      c = mix(c, vec3(0.006, 0.007, 0.02), e * uStyle * 0.92);

      c = aces(c * uExposure);
      c = pow(c, vec3(1.0 / 2.2));
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      // anime grade: richer colour, teal-indigo shadows, warm highlights
      c = mix(vec3(l), c, 1.0 + 0.45 * uStyle);
      vec3 shadowT = mix(vec3(0.84, 0.95, 1.12), vec3(0.66, 0.86, 1.32), uStyle);
      vec3 highT = mix(vec3(1.06, 0.99, 0.9), vec3(1.1, 0.97, 0.86), uStyle);
      c *= mix(shadowT, highT, smoothstep(0.04, 0.55, l));
      c += vec3(0.004, 0.009, 0.022) * (1.0 - l) * (1.0 + uStyle);
      vec2 qa = q; qa.x *= uRes.x / uRes.y;
      c *= mix(0.42, 1.0, smoothstep(1.05, 0.22, length(qa)));
      c += (hash(vUv * uRes + fract(uTime) * 61.0) - 0.5) * uGrain;
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`,
});
// ShaderPass clones its uniforms; re-link the ones that must stay live
grade.uniforms.tND.value = ndRT.texture;
grade.uniforms.uStyle = STYLE.uStyle;
grade.uniforms.uFog = fogUniform;
composer.addPass(grade);
const ndHidden = [sky, reflector, rain, ripples, glowMesh, streaks, ...spillMeshes, ...mistLayers.map(l => l.mesh)];

/* ---------------- camera controls + views ---------------- */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.8; controls.panSpeed = 0.7;
controls.minDistance = 6; controls.maxDistance = 58;
controls.minPolarAngle = 0.28; controls.maxPolarAngle = 1.43;
controls.screenSpacePanning = false;
controls.autoRotateSpeed = 0.28;

const VIEWS = {
  iso:    { target: new THREE.Vector3(0, 0.8, 0),   r: 32, phi: 0.88, theta: 0.82 },
  street: { target: new THREE.Vector3(-1, 1.5, -2.2), r: 13, phi: 1.40, theta: 1.33 },
};
function viewFov() { return camera.aspect < 0.8 ? 44 : camera.aspect < 1.2 ? 36 : 30; }
function placeCamera(v) {
  controls.target.copy(v.target);
  camera.position.setFromSphericalCoords(v.r, v.phi, v.theta).add(v.target);
  controls.update();
}
let tween = null;
function goTo(name) {
  const v = VIEWS[name];
  document.getElementById('vIso').setAttribute('aria-pressed', String(name === 'iso'));
  document.getElementById('vStreet').setAttribute('aria-pressed', String(name === 'street'));
  if (reduceMotion) { placeCamera(v); return; }
  const from = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  let dTheta = v.theta - from.theta; dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
  tween = { t: 0, from, fromTarget: controls.target.clone(), v, dTheta };
}

/* ---------------- UI ---------------- */
const state = { rain: true, mist: true, orbit: !reduceMotion, cut: true };
function setBtn(id, on) { document.getElementById(id).setAttribute('aria-pressed', String(on)); }
function setOrbit(on) { state.orbit = on; controls.autoRotate = on; setBtn('tOrbit', on); }
document.getElementById('vIso').addEventListener('click', () => goTo('iso'));
document.getElementById('vStreet').addEventListener('click', () => goTo('street'));
document.getElementById('tRain').addEventListener('click', () => { state.rain = !state.rain; rain.visible = ripples.visible = state.rain; setBtn('tRain', state.rain); });
document.getElementById('tMist').addEventListener('click', () => { state.mist = !state.mist; mistLayers.forEach(l => l.mesh.visible = state.mist); setBtn('tMist', state.mist); });
document.getElementById('tOrbit').addEventListener('click', () => setOrbit(!state.orbit));
document.getElementById('tCut').addEventListener('click', () => { state.cut = !state.cut; setBtn('tCut', state.cut); });
const styleInput = document.getElementById('style');
styleInput.addEventListener('input', () => { STYLE.uStyle.value = styleInput.value / 100; });
controls.addEventListener('start', () => { tween = null; if (state.orbit) setOrbit(false); });
setOrbit(state.orbit);

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = viewFov(); camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * PR, h * PR);
  ndRT.setSize(Math.round(w * PR), Math.round(h * PR));
  reflector.getRenderTarget().setSize(Math.round(w * PR * RS), Math.round(h * PR * RS));
}
window.addEventListener('resize', resize);
resize();
placeCamera(VIEWS.iso);

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
let time = 0;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.6);
    const k = ease(tween.t), v = tween.v, f = tween.from;
    controls.target.lerpVectors(tween.fromTarget, v.target, k);
    const r = f.radius + (v.r - f.radius) * k, phi = f.phi + (v.phi - f.phi) * k, th = f.theta + tween.dTheta * k;
    camera.position.setFromSphericalCoords(r, phi, th).add(controls.target);
    if (tween.t >= 1) tween = null;
  }
  controls.update();
  const tg = controls.target;
  tg.x = Math.max(-30, Math.min(30, tg.x)); tg.z = Math.max(-3.2, Math.min(3.2, tg.z)); tg.y = Math.max(0.4, Math.min(4, tg.y));

  rainMat.uniforms.uTime.value = time;
  rainMat.uniforms.uCenter.value.set(tg.x, 0, tg.z);
  ripMat.uniforms.uTime.value = time;
  for (const l of mistLayers) { l.tex.offset.x = time * l.speed; l.tex.offset.y = time * l.speed * 0.35; }

  // the walker and the lantern they carry
  const span = WALK.x0 - WALK.x1;
  const wx = WALK.x0 - ((time * WALK.speed) % span);
  walker.position.set(wx, Math.abs(Math.sin(time * 4.2)) * 0.03, WALK.z);
  walker.rotation.y = -Math.PI / 2;
  handLantern.position.y = 0.72 + Math.sin(time * 4.2) * 0.02;
  const hp = new THREE.Vector3(); handLantern.getWorldPosition(hp);
  uLightPos[WALKER_SLOT].copy(hp);
  uLightCol[WALKER_SLOT].set(0.45, 0.25, 0.09);
  const ga = glowGeo.attributes.aPos; ga.setXYZ(walkerGlowIndex, hp.x, hp.y, hp.z); ga.needsUpdate = true;

  // see-through: dissolve whatever sits between an overhead camera and the street
  const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(tg));
  CUT.uCutOn.value = state.cut ? THREE.MathUtils.smoothstep(1.3 - sph.phi, 0.0, 0.22) : 0;
  CUT.uCutDepth.value = sph.radius - 1.6;
  CUT.uAspect.value = camera.aspect;

  // normal/depth prepass for the outlines
  const wasVisible = ndHidden.map(o => o.visible);
  for (const o of ndHidden) o.visible = false;
  scene.overrideMaterial = ndMat;
  renderer.setRenderTarget(ndRT);
  renderer.setClearColor(0x8080ff, 1); renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  scene.overrideMaterial = null;
  renderer.setClearColor(FOG, 1);
  ndHidden.forEach((o, i) => { o.visible = wasVisible[i]; });

  grade.uniforms.uTime.value = reduceMotion ? 0 : time;
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
