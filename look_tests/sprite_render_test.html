<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infamy - sprite render test</title>
<style>
  :root { --bg:#121417; --panel:#1b1e23; --line:#2c3038; --text:#d9d4c7; --muted:#8a8578; --accent:#b8323a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  body { display:flex; }
  #side { width:300px; flex:none; background:var(--panel); border-right:1px solid var(--line); padding:14px; overflow:auto; }
  #main { flex:1; position:relative; min-width:0; }
  #view { display:block; width:100%; height:100%; }
  h1 { font-size:16px; margin:0 0 10px; letter-spacing:.03em; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:16px 0 6px; }
  #drop { border:1px dashed var(--line); border-radius:6px; padding:14px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop2 { border:1px dashed var(--line); border-radius:6px; padding:8px; text-align:center; color:var(--muted); cursor:pointer; font-size:12px; }
  #drop.over { border-color:var(--accent); color:var(--text); }
  #clips { list-style:none; margin:0; padding:0; }
  #clips li { padding:5px 8px; border-radius:4px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #clips li:hover { background:#252931; }
  #clips li.on { background:var(--accent); color:#fff; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:6px 0; }
  select, input[type=number] { background:#111317; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 6px; width:96px; }
  button { width:100%; margin-top:12px; padding:9px; background:var(--accent); color:#fff; border:0; border-radius:5px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  #log { margin-top:12px; font-size:12px; color:var(--muted); white-space:pre-wrap; }
  .tag { position:absolute; color:var(--muted); font:600 12px system-ui; pointer-events:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="side">
  <h1>Sprite render test</h1>
  <div id="drop">Drop a character model (e.g. ronin.fbx) and its animation FBX files here, or click to pick them.
    <input id="pick" type="file" accept=".fbx" multiple hidden></div>

  <h2>Animations</h2>
  <ul id="clips"><li style="color:var(--muted);cursor:default">No model loaded yet</li></ul>
  <label>Play animations in place <input id="inplace" type="checkbox" checked></label>

  <h2>Held item</h2>
  <div id="dropItem" class="drop2">Click to pick an item model (.glb or .fbx), e.g. a rifle
    <input id="pickItem" type="file" accept=".glb,.gltf,.fbx" hidden></div>
  <label>Held in <select id="itemMode"><option value="both" selected>both hands</option><option value="right">right hand</option><option value="left">left hand</option></select></label>
  <label>Length <input id="itemLen" type="number" min="0.1" max="3" step="0.05" value="1.3"></label>
  <label>Grip point (0 back, 1 front) <input id="itemGrip" type="number" min="0" max="1" step="0.05" value="0.3"></label>
  <label>Flip front/back <input id="itemFlip" type="checkbox"></label>
  <label>Roll (deg) <input id="itemRoll" type="number" min="-180" max="180" step="15" value="0"></label>
  <label>Turn X / Y (deg, one hand) <span><input id="itemRx" type="number" step="15" value="0" style="width:46px"> <input id="itemRy" type="number" step="15" value="0" style="width:46px"></span></label>

  <h2>Spritesheet</h2>
  <label>Frame size (px) <select id="size"><option>96</option><option>128</option><option selected>160</option><option>192</option><option>256</option></select></label>
  <label>Frames per second <input id="fps" type="number" min="4" max="30" value="12"></label>
  <label>Max frames <input id="maxf" type="number" min="1" max="64" value="32"></label>
  <label>Character scale <input id="cscale" type="number" min="0.5" max="1.5" step="0.05" value="1"></label>
  <label>Zoom <input id="zoom" type="number" min="0.5" max="2" step="0.05" value="1"></label>
  <button id="export" disabled>Export spritesheet</button>
  <div id="log"></div>
</div>
<div id="main"><canvas id="view"></canvas></div>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Rows of the spritesheet, top to bottom
const DIRS = ['S', 'SW', 'W', 'NW', 'N', 'NE', 'E', 'SE'];
const CHAR_HEIGHT = 2;            // world units after normalizing the model
const ELEVATION = Math.atan(0.5); // 2:1 dimetric: ground tiles are twice as wide as tall

const $ = id => document.getElementById(id);
const log = msg => { $('log').textContent = msg; };

// ---------- scene ----------
const scene = new THREE.Scene();

scene.add(new THREE.HemisphereLight(0x6a7488, 0x231b14, 1.8));
const key = new THREE.DirectionalLight(0xffd9a8, 3.0);   // warm lantern-like key from top-left of screen
key.position.set(-2, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x7f9cff, 1.6);   // cool moonlight rim from behind
rim.position.set(-3, 3, -5);
scene.add(rim);

// Camera sits to the south-east, looking at the origin from above at the dimetric angle
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const camDist = 20;
const VIEW_DIR = new THREE.Vector3(
  Math.cos(ELEVATION) * Math.SQRT1_2,
  Math.sin(ELEVATION),
  Math.cos(ELEVATION) * Math.SQRT1_2);   // from the target toward the camera

// Screen directions on the ground plane for this camera
const screenRight = new THREE.Vector3(1, 0, -1).normalize();
const screenDown = new THREE.Vector3(1, 0, 1).normalize();
const DIR_VEC = {
  E: screenRight, W: screenRight.clone().negate(),
  S: screenDown, N: screenDown.clone().negate(),
};
for (const [d, a, b] of [['NE', 'N', 'E'], ['NW', 'N', 'W'], ['SE', 'S', 'E'], ['SW', 'S', 'W']])
  DIR_VEC[d] = DIR_VEC[a].clone().add(DIR_VEC[b]).normalize();
// Mixamo characters face +Z, so the yaw that faces a ground direction d is atan2(d.x, d.z)
const yawFor = d => Math.atan2(DIR_VEC[d].x, DIR_VEC[d].z);

// Half the view height in world units. 1.5 leaves room below the feet for
// lunges and falls (1.2 cut them off at 128px); at 160px cells the character
// stays the same pixel size as the old 128px sheets.
const VIEW_HALF = 1.5;

function frameCamera(cam, aspect) {
  const half = VIEW_HALF / Number($('zoom').value);
  cam.top = half; cam.bottom = -half;
  cam.left = -half * aspect; cam.right = half * aspect;
  // Aim at the character's middle so it sits centered in each cell
  const target = new THREE.Vector3(0, CHAR_HEIGHT * 0.45, 0);
  cam.position.copy(target).addScaledVector(VIEW_DIR, camDist);
  cam.lookAt(target);
  cam.updateProjectionMatrix();
}

// ---------- renderer / preview ----------
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x121417, 1);

const tags = DIRS.map(d => { const el = document.createElement('div'); el.className = 'tag'; el.textContent = d; $('main').appendChild(el); return el; });

let root = null;       // normalized character
let bindHips = null;   // hips rest position, local to the rig
let modelName = 'model';
let mixer = null;
let clips = [];        // { name, clip }
let current = null;    // index into clips
const timer = new THREE.Timer();

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
}
addEventListener('resize', resize);
resize();

function renderGrid() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const cols = 4, rows = 2;
  const cw = Math.floor(w / cols), ch = Math.floor(h / rows);
  renderer.setScissorTest(true);
  renderer.setClearColor(0x121417, 1);
  renderer.clear();
  frameCamera(camera, cw / ch);
  DIRS.forEach((d, i) => {
    const x = (i % cols) * cw, yTop = Math.floor(i / cols) * ch;
    renderer.setViewport(x, h - yTop - ch, cw, ch);
    renderer.setScissor(x, h - yTop - ch, cw, ch);
    renderer.setClearColor(i % 2 ? 0x16191d : 0x1a1d22, 1);
    renderer.clear();
    if (root) { root.rotation.y = yawFor(d); updateItem(); renderer.render(scene, camera); }
    tags[i].style.left = (x + 8) + 'px';
    tags[i].style.top = (yTop + 6) + 'px';
  });
  renderer.setScissorTest(false);
}

renderer.setAnimationLoop(() => {
  timer.update();
  const dt = timer.getDelta();
  if (mixer) mixer.update(dt);
  renderGrid();
});

// ---------- loading ----------
const loader = new FBXLoader();

function hasSkin(obj) {
  let found = false;
  obj.traverse(o => { if (o.isSkinnedMesh) found = true; });
  return found;
}

// Keep clips centered over the model's rest position on the ground plane.
// Clips that travel (runs, jumps, lunges) get their hips pinned there. Clips
// that stay put (idles, in-place walks) keep their own small hip sway, only
// shifted to center, because pinning the hips would slide the planted feet.
// Height is kept so jumps and crouches still move up and down.
const SWAY_LIMIT = 0.2;   // horizontal hip travel, as a fraction of hip height
function stripRootMotion(clip) {
  const c = clip.clone();
  for (const t of c.tracks) {
    if (!/hips\.position$/i.test(t.name) || !bindHips) continue;
    const v = t.values, n = v.length / 3;
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity, mx = 0, mz = 0;
    for (let i = 0; i < v.length; i += 3) {
      x0 = Math.min(x0, v[i]); x1 = Math.max(x1, v[i]); z0 = Math.min(z0, v[i + 2]); z1 = Math.max(z1, v[i + 2]);
      mx += v[i] / n; mz += v[i + 2] / n;
    }
    const still = Math.max(x1 - x0, z1 - z0) < SWAY_LIMIT * Math.abs(bindHips.y || 1);
    for (let i = 0; i < v.length; i += 3) {
      if (still) { v[i] += bindHips.x - mx; v[i + 2] += bindHips.z - mz; }
      else { v[i] = bindHips.x; v[i + 2] = bindHips.z; }
    }
    console.log(`${clip.name}: hips travel ${Math.max(x1 - x0, z1 - z0).toFixed(1)} of hip height ${bindHips.y.toFixed(1)}, ${still ? 'kept' : 'pinned'}`);
  }
  return c;
}

function setupModel(obj) {
  if (root) scene.remove(root);
  // Swap the loader's Phong materials for standard ones so the moody lights read better
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const out = mats.map(m => new THREE.MeshStandardMaterial({
      map: m.map || null, color: m.map ? 0xffffff : (m.color || new THREE.Color(0x888888)),
      normalMap: m.normalMap || null, roughness: 0.85, metalness: 0.0,
      transparent: m.transparent, alphaTest: m.alphaTest,
    }));
    o.material = Array.isArray(o.material) ? out : out[0];
  });

  // Normalize height and stand the character on the origin
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const s = CHAR_HEIGHT / size.y;
  obj.scale.multiplyScalar(s);
  obj.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(obj);
  const center = box2.getCenter(new THREE.Vector3());
  obj.position.x -= center.x; obj.position.z -= center.z; obj.position.y -= box2.min.y;

  bindHips = null;
  obj.traverse(o => { if (!bindHips && o.isBone && /hips$/i.test(o.name)) bindHips = o.position.clone(); });

  root = new THREE.Group();
  root.scale.setScalar(Number($('cscale').value));
  root.add(obj);
  scene.add(root);
  mixer = new THREE.AnimationMixer(obj);
}

// ---------- held item (weapon or prop attached to the hands) ----------
// The item is normalized so its longest side runs along +Z with length 1.
// "both hands": placed at the main hand and pointed at the other hand every
// frame, so two-handed weapons (rifles, great swords) line up in any pose.
// "right"/"left": rides on that hand bone, pointing out of the thumb side of the fist.
let item = null;      // holder group in the scene
let itemBox = null;   // normalized model inside the holder
const gltfLoader = new GLTFLoader();
const num = id => Number($(id).value);
const findBone = re => { let b = null; root?.traverse(o => { if (!b && o.isBone && re.test(o.name)) b = o; }); return b; };

async function loadItem(file) {
  const buf = await file.arrayBuffer();
  const obj = /\.fbx$/i.test(file.name) ? loader.parse(buf, '') : (await gltfLoader.parseAsync(buf, '')).scene;
  obj.traverse(o => { if (o.isMesh) { o.frustumCulled = false; if (o.material?.isMeshPhongMaterial) o.material = new THREE.MeshStandardMaterial({ map: o.material.map, roughness: 0.6, metalness: 0.2 }); } });
  setItemObject(obj);
  log(`Item ${file.name} loaded.`);
}

function setItemObject(obj) {
  if (item) item.parent?.remove(item);
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const inner = new THREE.Group();
  obj.position.sub(center);
  inner.add(obj);
  // Turn the longest side onto +Z, then scale it to length 1
  const long = Math.max(size.x, size.y, size.z);
  if (long === size.x) inner.rotation.y = -Math.PI / 2; else if (long === size.y) inner.rotation.x = Math.PI / 2;
  inner.scale.setScalar(1 / long);
  itemBox = new THREE.Group();
  itemBox.add(inner);
  item = new THREE.Group();
  item.add(itemBox);
}


// ---------- built-in stylized weapons (real geometry instead of image slabs) ----------
// Both are built with the back end at z = 0 and the tip/head at z = 1.
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}
// Cool moonlight rim on top of the scene lights, so weapon edges read against the character
function rimify(mat, rimColor = 0x8fb4ff, k = 0.8, power = 2.4) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.rimCol = { value: new THREE.Color(rimColor) };
    sh.fragmentShader = 'uniform vec3 rimCol;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       totalEmissiveRadiance += rimCol * ${k.toFixed(2)} * pow(1.0 - saturate(abs(dot(normalize(vNormal), normalize(vViewPosition)))), ${power.toFixed(1)});`);
  };
  return mat;
}
const std = (o, rim) => rimify(new THREE.MeshStandardMaterial(o), ...(rim || []));

function buildClub() {
  const g = new THREE.Group();
  // Dark ironwood with long grain streaks; leather wrap over the handle (v along the club)
  const wood = canvasTex(64, 256, (c, w, h) => {
    c.fillStyle = '#4b3223'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) { c.strokeStyle = `rgba(${i % 3 ? '20,12,6' : '120,84,52'},${0.12 + Math.random() * 0.25})`; c.lineWidth = 1 + Math.random() * 2; const x = Math.random() * w; c.beginPath(); c.moveTo(x, 0); c.bezierCurveTo(x + 6 * (Math.random() - .5), h / 3, x - 6 * (Math.random() - .5), h * 2 / 3, x + 4 * (Math.random() - .5), h); c.stroke(); }
    c.fillStyle = '#1d1511'; c.fillRect(0, h * 0.93, w, h * 0.07);                                 // v=0 is the back end (pommel)
    c.fillStyle = '#2a1c14'; c.fillRect(0, h * 0.64, w, h * 0.29);                                 // leather wrap (z .07 - .28 after the flip below)
    c.strokeStyle = '#6a4c36'; c.lineWidth = 2;
    for (let y = h * 0.64 - 20; y < h * 0.93 + 20; y += 7) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y + 14); c.stroke(); }
  });
  const prof = [];
  const N = 64;
  for (let i = 0; i <= N; i++) {
    const z = i / N;
    let r;
    if (z < 0.04) r = 0.034 * Math.sin(z / 0.04 * Math.PI / 2) ** 0.6;   // pommel knob
    else if (z < 0.07) r = 0.034 - (z - 0.04) / 0.03 * 0.008;
    else if (z < 0.3) r = 0.026;
    else if (z < 0.96) { const u = (z - 0.3) / 0.66; r = 0.026 + 0.066 * Math.pow(u, 1.4); }
    else r = 0.092 * Math.sqrt(Math.max(0, 1 - ((z - 0.96) / 0.04) ** 2));  // rounded end
    prof.push(new THREE.Vector2(Math.max(r, 0.0001), z));
  }
  const body = new THREE.LatheGeometry(prof, 18);
  body.rotateX(Math.PI / 2);
  // flip v so texture v=1 sits at z=0 (canvas y=0 is v=1)
  g.add(new THREE.Mesh(body, std({ map: wood, roughness: 0.75, metalness: 0.05, emissive: 0x2a170b }, [0x9ab8ff, 0.22])));
  const iron = std({ color: 0x3a3e46, roughness: 0.4, metalness: 0.6, emissive: 0x10141a }, [0xa9c4ff, 0.5]);
  const rAt = z => prof[Math.round(z * N)].x;
  const band = (z, h) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rAt(z) + 0.007, rAt(z) + 0.007, h, 18), iron); m.rotation.x = Math.PI / 2; m.position.z = z; g.add(m); };
  [0.56, 0.74, 0.9].forEach(z => band(z, 0.035));
  band(0.3, 0.02);
  // studs in two staggered rows on the head
  const stud = new THREE.SphereGeometry(0.013, 8, 6);
  [[0.82, 0], [0.86, Math.PI / 8]].forEach(([z, off]) => { for (let k = 0; k < 8; k++) { const a = off + k * Math.PI / 4, r = rAt(z) + 0.002; const m = new THREE.Mesh(stud, iron); m.position.set(Math.cos(a) * r, Math.sin(a) * r, z); g.add(m); } });
  return g;
}

function buildKatana() {
  const g = new THREE.Group();
  const gold = std({ color: 0xb08a40, roughness: 0.35, metalness: 0.7, emissive: 0x120d04 }, [0xffe2a0, 0.8]);
  const darkIron = std({ color: 0x1f2126, roughness: 0.45, metalness: 0.7 }, [0xa9c4ff, 0.9]);
  const cyl = (rx, ry, z0, z1, mat, seg = 16) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, z1 - z0, seg), mat); m.scale.set(rx, 1, ry); m.rotation.x = Math.PI / 2; m.position.z = (z0 + z1) / 2; g.add(m); return m; };
  // Handle: indigo cord in a diamond wrap over pale ray-skin
  const wrap = canvasTex(64, 128, (c, w, h) => {
    c.fillStyle = '#d8d2c2'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#1b2440';
    for (let y = -h; y < h * 2; y += 32) { c.beginPath(); c.moveTo(0, y); c.lineTo(w / 2, y + 16); c.lineTo(w, y); c.lineTo(w, y + 9); c.lineTo(w / 2, y + 25); c.lineTo(0, y + 9); c.fill(); c.beginPath(); c.moveTo(0, y + 16); c.lineTo(w / 2, y + 32); c.lineTo(w, y + 16); c.lineTo(w, y + 25); c.lineTo(w / 2, y + 41); c.lineTo(0, y + 25); c.fill(); }
  });
  wrap.repeat.set(1, 2);
  const tsuka = cyl(0.032, 0.024, 0.02, 0.27, std({ map: wrap, roughness: 0.8, metalness: 0 }, [0x8fb4ff, 0.5]));
  cyl(0.036, 0.028, 0, 0.022, gold);                       // kashira (pommel cap)
  cyl(0.037, 0.029, 0.27, 0.29, gold);                     // fuchi (collar)
  cyl(0.085, 0.062, 0.29, 0.3, darkIron, 20);           // tsuba (guard)
  cyl(0.088, 0.065, 0.2915, 0.2985, gold, 20);             // gold rim
  // Blade swept along z with a ridge line: flat-shaded facets catch the key light, vertex colours fake the hamon
  const z0 = 0.31, z1 = 1.0, steps = 28, W0 = 0.075, T0 = 0.011, SORI = 0.1, TIP = 0.07;
  const rings = [];
  for (let i = 0; i <= steps; i++) {
    const s = i / steps, z = z0 + (z1 - z0) * s;
    const taper = s > 1 - TIP / (z1 - z0) ? Math.max(0, 1 - (s - (1 - TIP / (z1 - z0))) / (TIP / (z1 - z0))) : 1;
    const w = W0 * (1 - 0.3 * s) * taper, t = T0 * (1 - 0.4 * s) * (0.15 + 0.85 * taper);
    const spine = -SORI * s * s;                     // tip curves toward the spine side (+y); edge faces -y (down)
    // ring points: [y (width axis, edge at -y), x (thickness), colour]
    rings.push({ z, p: [
      [-spine - w, 0, [0.95, 0.97, 1.0]],            // edge
      [-spine - w * 0.65, t, [0.8, 0.86, 0.94]],     // hamon line
      [-spine - w * 0.3, t * 1.05, [0.52, 0.58, 0.67]],   // shinogi ridge
      [-spine, t * 0.8, [0.3, 0.34, 0.42]],          // spine
      [-spine, -t * 0.8, [0.3, 0.34, 0.42]],
      [-spine - w * 0.3, -t * 1.05, [0.52, 0.58, 0.67]],
      [-spine - w * 0.65, -t, [0.8, 0.86, 0.94]],
    ] });
  }
  const pos = [], col = [];
  const push = (r, k) => { const [y, x, c] = r.p[k]; pos.push(x, y, r.z); col.push(...c); };
  for (let i = 0; i < steps; i++) {
    const a = rings[i], b = rings[i + 1], n = a.p.length;
    for (let k = 0; k < n; k++) { const k2 = (k + 1) % n; push(a, k); push(b, k); push(b, k2); push(a, k); push(b, k2); push(a, k2); }
  }
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  bg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  // Fix winding so every face points away from the blade's centre line
  const P = bg.attributes.position, C = bg.attributes.color;
  for (let f = 0; f < P.count; f += 3) {
    const v = [0, 1, 2].map(j => new THREE.Vector3().fromBufferAttribute(P, f + j));
    const n = v[1].clone().sub(v[0]).cross(v[2].clone().sub(v[0]));
    const cen = v[0].clone().add(v[1]).add(v[2]).divideScalar(3);
    const mid = new THREE.Vector3(0, -(W0 * 0.5), cen.z);   // rough centre of the cross-section
    if (n.dot(cen.sub(mid)) < 0) { for (const A of [P, C]) { const sz = A.itemSize; for (let c = 0; c < sz; c++) { const t = A.array[(f + 1) * sz + c]; A.array[(f + 1) * sz + c] = A.array[(f + 2) * sz + c]; A.array[(f + 2) * sz + c] = t; } } }
  }
  bg.computeVertexNormals();
  g.add(new THREE.Mesh(bg, std({ vertexColors: true, roughness: 0.28, metalness: 0.45, emissive: 0x0c1218 }, [0xbad2ff, 1.1, 2.0])));
  cyl(0.045, 0.018, 0.3, 0.34, gold);                  // habaki (blade collar)
  return g;
}
// Police jitte: iron truncheon with a side hook (kagi) above a cord-wrapped handle
function buildJitte() {
  const g = new THREE.Group();
  const iron = std({ color: 0x4a4f58, roughness: 0.35, metalness: 0.7, emissive: 0x0e1218 }, [0xa9c4ff, 0.9]);
  const cord = canvasTex(32, 128, (c, w, h) => {
    c.fillStyle = '#3a1612'; c.fillRect(0, 0, w, h);
    c.strokeStyle = '#7a3a2a'; c.lineWidth = 2;
    for (let y = -16; y < h + 16; y += 6) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y + 10); c.stroke(); }
  });
  const cyl = (r0, r1, z0, z1, mat) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, z1 - z0, 14), mat); m.rotation.x = Math.PI / 2; m.position.z = (z0 + z1) / 2; g.add(m); return m; };
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.009, 8, 16), iron);   // pommel ring
  ring.rotation.y = Math.PI / 2; ring.position.z = 0.0; g.add(ring);
  cyl(0.026, 0.026, 0.02, 0.32, std({ map: cord, roughness: 0.85, metalness: 0 }, [0x8fb4ff, 0.4]));
  cyl(0.03, 0.03, 0.32, 0.345, iron);                     // collar
  cyl(0.024, 0.018, 0.345, 0.985, iron);                  // shaft
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.018, 10, 8), iron); tip.position.z = 0.985; g.add(tip);
  // hook: a short arm out to the side, then a prong running up beside the shaft
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.016, 0.022), iron); arm.position.set(0.045, 0, 0.36); g.add(arm);
  const prong = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.011, 0.16, 8), iron); prong.rotation.x = Math.PI / 2; prong.position.set(0.07, 0, 0.44); g.add(prong);
  return g;
}
const PROC_ITEMS = { club: buildClub, katana: buildKatana, jitte: buildJitte };

const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _s = new THREE.Vector3();
// Hand distance (in character heights / 2) below which both hands hold the
// item, and above which it hangs from the right hand alone
const HANDS_TOGETHER = 0.22, HANDS_APART = 0.38;
const _c = new THREE.Vector3();
const PALM_Y = 0.03;   // palm centre along the hand bone (bone units, Mixamo +Y runs to the fingers)
const _z = new THREE.Vector3(0, 0, 1);
let itemDir = null;    // haft direction in the hand bone's frame (one-hand grips)
const palmOf = (bone, out) => bone.localToWorld(out.set(0, PALM_Y, 0));
let itemHang = false;   // swords hang when the hands part; rifles stay between the hands
function updateItem() {
  if (!item || !root) return;
  root.updateMatrixWorld(true);
  const mode = $('itemMode').value, len = num('itemLen'), grip = num('itemGrip');
  const flip = $('itemFlip').checked ? Math.PI : 0;
  // Slide the model so the grip point sits at the hand, and apply flip and roll
  itemBox.position.set(0, 0, (0.5 - grip) * (flip ? -1 : 1));
  itemBox.rotation.set(0, flip, THREE.MathUtils.degToRad(num('itemRoll')), 'ZYX');
  const right = findBone(/RightHand$/), left = findBone(/LeftHand$/);
  if (mode === 'both' && right && left) {
    if (item.parent !== scene) scene.add(item);
    palmOf(right, _a); palmOf(left, _b);
    item.position.copy(_a);
    item.scale.setScalar(len * root.scale.x);
    // When the hands come apart (idles, walks with arms at the sides) the item
    // can't span both, so it hangs from the right hand instead: blade down and a
    // little forward along the leg, blending over as the hands separate
    const apart = !itemHang ? 0 : THREE.MathUtils.smoothstep(_a.distanceTo(_b) / root.scale.x, HANDS_TOGETHER, HANDS_APART);
    if (apart > 0) {
      const yaw = root.rotation.y, sign = flip ? -1 : 1;
      _c.set(Math.sin(yaw) * 0.7, 0.9, Math.cos(yaw) * 0.7).normalize().multiplyScalar(sign);   // where the item's +Z should point
      _b.sub(_a).normalize().lerp(_c, apart).add(_a);
    }
    item.lookAt(_b);   // +Z of the item points from the right hand to the left
  } else {
    const bone = mode === 'left' ? left : right;
    if (!bone) return;
    if (item.parent !== bone) bone.add(item);
    bone.getWorldScale(_s);
    item.scale.setScalar(len * root.scale.x / _s.x);
    if (itemDir) {
      // Hammer grip: the haft runs across the fist along the knuckle line, head out of the thumb side
      item.position.set(0, PALM_Y, 0);
      item.quaternion.setFromUnitVectors(_z, itemDir);
      item.rotateZ(THREE.MathUtils.degToRad(num('itemRoll')));
      return;
    }
    item.position.set(0, 0, 0);
    // Mixamo hand bones point +Y along the fingers; -Z comes out of the thumb
    // side of a closed fist, which is where a gripped blade or haft points
    item.rotation.set(THREE.MathUtils.degToRad(num('itemRx') + 180), THREE.MathUtils.degToRad(num('itemRy')), 0);
  }
}

function setItemOptions(o = {}) {
  if (o.mode) $('itemMode').value = o.mode;
  for (const [k, id] of [['length', 'itemLen'], ['grip', 'itemGrip'], ['roll', 'itemRoll'], ['rx', 'itemRx'], ['ry', 'itemRy']])
    if (o[k] != null) $(id).value = o[k];
  if (o.flip != null) $('itemFlip').checked = !!o.flip;
  itemHang = !!o.hang;
  itemDir = o.dir ? new THREE.Vector3(...o.dir).normalize() : null;
}

$('dropItem').onclick = () => $('pickItem').click();
$('pickItem').onchange = e => e.target.files[0] && loadItem(e.target.files[0]);

function addClips(list, label) {
  for (const clip of list) {
    const name = list.length > 1 ? `${label} (${clip.name})` : label;
    clips.push({ name, clip });
  }
}

function refreshClipList() {
  const ul = $('clips');
  ul.innerHTML = '';
  if (!clips.length) { ul.innerHTML = '<li style="color:var(--muted);cursor:default">No animations yet</li>'; return; }
  clips.forEach((c, i) => {
    const li = document.createElement('li');
    li.textContent = c.name;
    li.className = i === current ? 'on' : '';
    li.onclick = () => play(i);
    ul.appendChild(li);
  });
}

function play(i) {
  if (!mixer || !clips[i]) return;
  current = i;
  mixer.stopAllAction();
  const clip = $('inplace').checked ? stripRootMotion(clips[i].clip) : clips[i].clip;
  mixer.clipAction(clip).reset().play();
  refreshClipList();
  $('export').disabled = false;
}
// Size relative to other characters (every model is first normalized to the same height)
$('cscale').onchange = () => root && root.scale.setScalar(Number($('cscale').value));
$('inplace').onchange = () => current != null && play(current);

async function loadFiles(files) {
  files = [...files].filter(f => /\.fbx$/i.test(f.name));
  if (!files.length) { log('Only .fbx files are supported.'); return; }
  log('Loading ' + files.length + ' file(s)...');
  const parsed = [];
  for (const f of files) {
    try {
      const obj = loader.parse(await f.arrayBuffer(), '');
      parsed.push({ file: f, obj });
    } catch (e) {
      console.error(e);
      log(`Could not read ${f.name}: ${e.message}`);
    }
  }
  // The file with a skinned mesh is the character; everything else only donates clips
  const model = parsed.find(p => hasSkin(p.obj) && /ronin|model/i.test(p.file.name)) || parsed.find(p => hasSkin(p.obj) && !root);
  if (model) {
    clips = [];
    current = null;
    modelName = model.file.name.replace(/\.fbx$/i, '');
    setupModel(model.obj);
    addClips(model.obj.animations, model.file.name.replace(/\.fbx$/i, '') + ' (built in)');
  }
  if (!root) { log('Drop the character model (ronin.fbx) first or together with the animations.'); return; }
  for (const p of parsed) if (p !== model) addClips(p.obj.animations, p.file.name.replace(/\.fbx$/i, ''));
  refreshClipList();
  if (current == null && clips.length) {
    const idle = clips.findIndex(c => /idle/i.test(c.name));
    play(idle >= 0 ? idle : 0);
  }
  log(`${clips.length} animation(s) ready. Pick one, then export.`);
}

const drop = $('drop');
drop.onclick = () => $('pick').click();
$('pick').onchange = e => loadFiles(e.target.files);
addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
addEventListener('dragleave', () => drop.classList.remove('over'));
addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); loadFiles(e.dataTransfer.files); });

// ---------- export ----------
// Glow pass for the in-game weapon glow (render/characters.js): the held item alone in white,
// hidden where the body is in front of it, blurred into a soft halo at half size.
// Same rows and frames as the colour sheet, so the game reads it with the same frame numbers.
const GLOW_BODY = new THREE.MeshBasicMaterial({ colorWrite: false });   // depth only: hides the item behind the body
const GLOW_ITEM = new THREE.MeshBasicMaterial({ color: 0xffffff });
function glowSwap(on, saved) {
  if (on) {
    const inItem = new Set();
    item.traverse(o => o.isMesh && inItem.add(o));
    const swap = (o, mat, order) => { saved.push([o, o.material, o.renderOrder]); o.material = mat; o.renderOrder = order; };
    root.traverse(o => o.isMesh && !inItem.has(o) && swap(o, GLOW_BODY, -1));   // body first, so its depth is there before the item draws
    inItem.forEach(o => swap(o, GLOW_ITEM, 1));
  } else for (const [o, m, r] of saved.splice(0)) { o.material = m; o.renderOrder = r; }
}

// Renders the spritesheet for clip i: 8 rows (directions) x N frames, transparent
// withGlow: also render the weapon glow sheet (needs a held item)
function renderSheet(i, withGlow = false) {
  const size = Number($('size').value);
  const fps = Math.max(1, Number($('fps').value));
  const entry = clips[i];
  const clip = $('inplace').checked ? stripRootMotion(entry.clip) : entry.clip;
  const frames = Math.max(1, Math.min(Number($('maxf').value), Math.round(clip.duration * fps)));

  const sheet = document.createElement('canvas');
  sheet.width = size * frames; sheet.height = size * DIRS.length;
  const ctx = sheet.getContext('2d');
  const doGlow = withGlow && !!item;
  const gs = size / 2;
  const glow = doGlow ? document.createElement('canvas') : null;
  let gctx = null, cell = null, cctx = null;
  if (doGlow) {
    glow.width = gs * frames; glow.height = gs * DIRS.length; gctx = glow.getContext('2d');
    cell = document.createElement('canvas'); cell.width = cell.height = gs; cctx = cell.getContext('2d');
  }
  const saved = [];

  const off = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  off.setPixelRatio(1);
  off.setSize(size, size);
  off.outputColorSpace = THREE.SRGBColorSpace;
  off.setClearColor(0x000000, 0);
  const cam = camera.clone();
  frameCamera(cam, 1);

  // Separate mixer so the live preview's state is restored afterwards
  const obj = root.children[0];
  const exMixer = new THREE.AnimationMixer(obj);
  exMixer.clipAction(clip).play();

  DIRS.forEach((d, row) => {
    root.rotation.y = yawFor(d);
    for (let f = 0; f < frames; f++) {
      exMixer.setTime((f / frames) * clip.duration);
      updateItem();
      off.render(scene, cam);
      ctx.drawImage(off.domElement, f * size, row * size);
      if (doGlow) {
        glowSwap(true, saved);
        off.render(scene, cam);
        glowSwap(false, saved);
        // soft halo plus a fainter sharp core, blurred inside its own cell so frames never bleed
        cctx.clearRect(0, 0, gs, gs);
        cctx.filter = 'blur(2.5px)'; cctx.globalAlpha = 1;
        cctx.drawImage(off.domElement, 0, 0, gs, gs);
        cctx.drawImage(off.domElement, 0, 0, gs, gs);
        cctx.filter = 'none'; cctx.globalAlpha = 0.5;
        cctx.drawImage(off.domElement, 0, 0, gs, gs);
        cctx.globalAlpha = 1;
        gctx.drawImage(cell, f * gs, row * gs);
      }
    }
  });

  exMixer.stopAllAction();
  exMixer.uncacheRoot(obj);
  off.dispose();
  play(current ?? i);

  const safe = s => s.replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '').toLowerCase();
  const clipName = /\(built in\)/.test(entry.name) ? 'walk' : entry.name;
  return { sheet, glow, frames, size, fps, fname: `${safe(modelName)}_${safe(clipName)}.png` };
}

$('export').onclick = () => {
  if (current == null) return;
  const { sheet, frames, size, fps, fname } = renderSheet(current);
  sheet.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
  log(`Exported ${fname}\nRows top to bottom: ${DIRS.join(', ')}\n${frames} frames at ${fps} fps, ${size}px each.`);
};

// Hooks for tools/export_sprites.mjs, which drives this page headlessly
window.spriteTest = {
  ready: () => clips.length > 0,
  clipCount: () => clips.length,
  render: (i, withGlow = false) => { const r = renderSheet(i, withGlow); return { fname: r.fname, frames: r.frames, dataUrl: r.sheet.toDataURL('image/png'), glowUrl: r.glow ? r.glow.toDataURL('image/png') : null }; },
  tracks: i => clips[i].clip.tracks.map(t => t.name),
  clipNames: () => clips.map(c => c.name),
  itemReady: () => !!item,
  setItemOptions,
  // A plain stick for checking alignment without a model
  testItem: () => setItemObject(new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 1), new THREE.MeshStandardMaterial({ color: 0xc0c0c0 }))),
  boneInfo: () => { root.updateMatrixWorld(true); const o={}; const g=n=>findBone(new RegExp(n+'$')); const R=g('RightHand'); const w=b=>b.getWorldPosition(new THREE.Vector3()); const inv=R.matrixWorld.clone().invert();
    for (const n of ['RightHand','RightHandThumb1','RightHandPinky1','RightHandIndex1','RightHandMiddle1','RightHandMiddle3']) { const b=g(n); if(b) o[n]=w(b).applyMatrix4(inv).toArray().map(v=>+v.toFixed(3)); } o.scale=R.getWorldScale(new THREE.Vector3()).x; o.rootScale=root.scale.x; return o; },
  setProcItem: k => setItemObject(PROC_ITEMS[k]()),
  setScale: s => { $('cscale').value = s; if (root) root.scale.setScalar(s); },
};

log('Waiting for files.');
</script>
</body>
